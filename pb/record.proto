syntax = "proto3";

package ledger.v1;

option go_package = "github.com/bbmumford/ledger/pb";

// LADRecord is the wire format for directory records in gossip exchanges.
// Each consumer defines its own record structure. HSTLES/ORBTR uses this
// for member, role, reach, and latency records. Hospitium defines CRDT
// record protos separately.
message LADRecord {
    string topic = 1;
    string nodeId = 2;
    string tenantId = 3;
    bytes body = 4;
    int64 timestampUnix = 5;
    uint64 lamportClock = 6;
    uint64 seq = 7;
    bool tombstone = 8;
    int64 deletedAtUnix = 9;
    string tombstoneReason = 10;
    bytes signature = 11;
    uint64 hlcTimestamp = 12;
    bytes authorPubkey = 13;
    string blobCid = 14;
    int64 expiresAtUnix = 15;
}
